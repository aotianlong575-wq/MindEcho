disabled_rules:
  - trailing_whitespace
  - line_length
  - type_name
  - identifier_name

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - collection_alignment
  - file_header

included:
  - src/
  - tests/

excluded:
  - .build/
  - scripts/

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20
