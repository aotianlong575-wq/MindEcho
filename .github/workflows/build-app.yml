name: Build iOS App

on:
  workflow_dispatch:    # 手动触发

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Build for iOS Simulator (arm64)
        run: |
          # 编译 Swift Package 到 iOS simulator 目标
          swift build \
            --configuration release \
            --triple arm64-apple-ios17.0-simulator \
            -Xswiftc "-sdk" -Xswiftc "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0-simulator" \
            2>&1 | tee build-ios.log

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build-ios.log
          retention-days: 30

      - name: Build Result
        run: |
          if grep -q "Build complete" build-ios.log 2>/dev/null; then
            echo "✅ iOS build succeeded"
          else
            echo "⚠️ Check build-ios.log for details"
          fi
