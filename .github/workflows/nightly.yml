name: Nightly Full Build

on:
  schedule:
    # 每天凌晨 3:00 UTC 自动跑一次
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  full-build:
    name: Nightly Full Build (iOS + macOS + visionOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-nightly-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Build for macOS
        run: swift build -c release

      - name: Build for iOS (library only)
        run: |
          # 在 Package.swift 有 iOS 平台支持的情况下
          swift build -c release --triple arm64-apple-ios17.0-simulator 2>&1 || \
          echo "iOS build skipped (requires Xcode project)"

      - name: Build for visionOS (library only)
        run: |
          swift build -c release --triple arm64-apple-xros1.0-simulator 2>&1 || \
          echo "visionOS build skipped (requires Xcode project)"

      - name: Run All Tests
        run: swift test -c release 2>&1 | tee test-nightly.log

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-logs
          path: "*.log"
          retention-days: 30

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Nightly build failed',
              body: `Nightly build [failed](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nPlease check the logs.`,
              labels: ['bug', 'ci']
            });
